<ion-content [fullscreen]="true">
  <div class="center-wrapper">
    <ion-card>
      <ion-card-header>
        <ion-card-title>Ajouter un contrôle</ion-card-title>
      </ion-card-header>
      <ion-card-content>
        <app-internal-controls-add [internalControlEntry]="internalControlEntry"></app-internal-controls-add>
      </ion-card-content>
    </ion-card>
    <ion-card class="control-history-card">
      <ion-card-header>
        <ion-card-title>Historique des contrôles</ion-card-title>
        <ion-card-subtitle>{{ numberOfIC }} entrées</ion-card-subtitle>
      </ion-card-header>
      <ion-card-content>
        <app-internal-controls-view></app-internal-controls-view>
      </ion-card-content>
    </ion-card>
  </div>
</ion-content>
